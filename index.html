<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel Masters Card Database</title>
<style>
  :root {
    --bg: #0d0f14;
    --bg-elev: #161922;
    --bg-elev-2: #1e2230;
    --border: #2a2f3f;
    --text: #e8e9ee;
    --text-dim: #9a9fb0;
    --accent: #7c8bff;
    --fire: #ff5f4d;
    --water: #3fa9f5;
    --nature: #4dd67a;
    --light: #f5d547;
    --darkness: #b06bd6;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }
  header h1 {
    margin: 0 0 12px 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 .count {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    background: var(--bg-elev-2);
    padding: 3px 10px;
    border-radius: 100px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .controls input[type="text"] {
    flex: 1 1 240px;
    min-width: 160px;
  }
  input[type="text"], select {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }
  select { cursor: pointer; }
  #clearBtn {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  #clearBtn:hover { color: var(--text); border-color: var(--accent); }

  main { padding: 20px; }
  #emptyState {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    display: none;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(124,139,255,0.15);
  }
  .card .imgwrap {
    aspect-ratio: 5 / 7;
    background: var(--bg-elev-2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card .noimg {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 10px;
  }
  .card .meta {
    padding: 8px 10px 10px;
  }
  .card .name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .sub {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .civ-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .civ-Fire { background: var(--fire); }
  .civ-Water { background: var(--water); }
  .civ-Nature { background: var(--nature); }
  .civ-Light { background: var(--light); }
  .civ-Darkness { background: var(--darkness); }

  /* Modal */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  #overlay.open { display: flex; }
  #modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 780px;
    width: 100%;
    padding: 24px;
    position: relative;
  }
  #modal .closeBtn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  #modal .modalBody {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  #modal .modalImg {
    flex: 0 0 260px;
    max-width: 260px;
  }
  #modal .modalImg img {
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  #modal .modalInfo {
    flex: 1 1 320px;
    min-width: 260px;
  }
  #modal h2 {
    margin: 0 0 4px 0;
    font-size: 22px;
  }
  #modal .tagRow {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 10px 0 16px;
  }
  .tag {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .field { margin-bottom: 14px; }
  .field .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .field .value {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
  }
  .field .value.flavor {
    font-style: italic;
    color: var(--text-dim);
  }
  .field .value.missing {
    color: var(--text-dim);
    font-style: italic;
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 30px 20px 50px;
  }

  @media (max-width: 480px) {
    #grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    header h1 { font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <h1>Duel Masters Card Database <span class="count" id="resultCount">— loading —</span></h1>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search name, rules text, flavor text, illustrator...">
    <select id="civFilter"><option value="">Any civilization</option></select>
    <select id="typeFilter"><option value="">Any type</option></select>
    <select id="rarityFilter"><option value="">Any rarity</option></select>
    <select id="setFilter"><option value="">Any set</option></select>
    <select id="manaFilter"><option value="">Any mana cost</option></select>
    <select id="sortSelect">
      <option value="name-asc">Name A-Z</option>
      <option value="name-desc">Name Z-A</option>
      <option value="mana-asc">Mana cost: low-high</option>
      <option value="mana-desc">Mana cost: high-low</option>
      <option value="set-asc">Set order</option>
    </select>
    <button id="clearBtn">Clear filters</button>
  </div>
</header>

<main>
  <div id="grid"></div>
  <div id="emptyState">No cards match your filters.</div>
</main>

<footer>
  Duel Masters DM-01–DM-12 + Promos · data sourced from Kaggle + shobu.io + Duel Masters Fandom wiki
</footer>

<div id="overlay">
  <div id="modal">
    <button class="closeBtn" id="closeModalBtn">&times;</button>
    <div class="modalBody" id="modalBody"></div>
  </div>
</div>

<script>
let ALL_CARDS = [];
let FACETS = {};

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const resultCount = document.getElementById('resultCount');
const searchInput = document.getElementById('searchInput');
const civFilter = document.getElementById('civFilter');
const typeFilter = document.getElementById('typeFilter');
const rarityFilter = document.getElementById('rarityFilter');
const setFilter = document.getElementById('setFilter');
const manaFilter = document.getElementById('manaFilter');
const sortSelect = document.getElementById('sortSelect');
const clearBtn = document.getElementById('clearBtn');
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');
const closeModalBtn = document.getElementById('closeModalBtn');

function imgSrc(card) {
  return card.image_url || card.image_local || '';
}

function populateSelect(sel, values) {
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    sel.appendChild(opt);
  });
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const civ = civFilter.value;
  const type = typeFilter.value;
  const rarity = rarityFilter.value;
  const set = setFilter.value;
  const mana = manaFilter.value;

  let results = ALL_CARDS.filter(c => {
    if (civ && c.civilization !== civ && c.civilization2 !== civ) return false;
    if (type && c.type !== type) return false;
    if (rarity && c.rarity !== rarity) return false;
    if (set && c.set !== set) return false;
    if (mana && String(c.mana_cost) !== mana) return false;
    if (q) {
      const hay = [c.name, c.rules_text, c.flavor_text, c.illustrator, c.abilities, c.race]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const [sortKey, sortDir] = sortSelect.value.split('-');
  results.sort((a, b) => {
    let av, bv;
    if (sortKey === 'name') { av = a.name || ''; bv = b.name || ''; }
    else if (sortKey === 'mana') { av = a.mana_cost ?? -1; bv = b.mana_cost ?? -1; }
    else if (sortKey === 'set') { av = (a.set || '') + a.set_number.padStart(5,'0'); bv = (b.set || '') + b.set_number.padStart(5,'0'); }
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  resultCount.textContent = `${results.length.toLocaleString()} of ${ALL_CARDS.length.toLocaleString()} cards`;

  grid.innerHTML = '';
  if (results.length === 0) {
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    const frag = document.createDocumentFragment();
    results.forEach(c => frag.appendChild(buildCardEl(c)));
    grid.appendChild(frag);
  }
}

function buildCardEl(c) {
  const el = document.createElement('div');
  el.className = 'card';
  const src = imgSrc(c);
  const civDot = c.civilization ? `<span class="civ-dot civ-${c.civilization}"></span>` : '';
  el.innerHTML = `
    <div class="imgwrap">
      ${src ? `<img loading="lazy" src="${src}" alt="${escapeHtml(c.name)}" onerror="this.parentElement.innerHTML='<div class=noimg>Image unavailable</div>'">` : `<div class="noimg">No image</div>`}
    </div>
    <div class="meta">
      <div class="name">${escapeHtml(c.name || '(unnamed)')}</div>
      <div class="sub">
        <span>${civDot}${c.mana_cost != null ? c.mana_cost : '-'}</span>
        <span>${escapeHtml(c.set || '')}</span>
      </div>
    </div>
  `;
  el.addEventListener('click', () => openModal(c));
  return el;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function field(label, value, opts) {
  opts = opts || {};
  const cls = opts.cls ? ` ${opts.cls}` : '';
  const display = (value === null || value === undefined || value === '') ? '<span class="missing">Not available</span>' : escapeHtml(value);
  return `<div class="field"><div class="label">${label}</div><div class="value${cls}">${display}</div></div>`;
}

function openModal(c) {
  const src = imgSrc(c);
  const tags = [c.civilization, c.civilization2, c.type, c.race, c.is_evolution ? 'Evolution' : null]
    .filter(Boolean).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

  modalBody.innerHTML = `
    <div class="modalImg">
      ${src ? `<img src="${src}" alt="${escapeHtml(c.name)}" onerror="this.style.display='none'">` : `<div class="noimg">No image available</div>`}
    </div>
    <div class="modalInfo">
      <h2>${escapeHtml(c.name)}</h2>
      <div class="tagRow">${tags}</div>
      ${field('Set', `${c.set || ''} ${c.set_number ? '#' + c.set_number : ''}`.trim())}
      ${field('Mana cost', c.mana_cost)}
      ${field('Power', c.power)}
      ${field('Rarity', c.rarity)}
      ${field('Rules text', c.rules_text)}
      ${field('Kaggle abilities (raw)', c.abilities)}
      ${field('Flavor text', c.flavor_text, {cls: 'flavor'})}
      ${field('Illustrator', c.illustrator)}
      ${field('Image source', c.image_source)}
    </div>
  `;
  overlay.classList.add('open');
}

closeModalBtn.addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('open'); });

searchInput.addEventListener('input', debounce(render, 150));
[civFilter, typeFilter, rarityFilter, setFilter, manaFilter, sortSelect].forEach(el => el.addEventListener('change', render));
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  civFilter.value = '';
  typeFilter.value = '';
  rarityFilter.value = '';
  setFilter.value = '';
  manaFilter.value = '';
  sortSelect.value = 'name-asc';
  render();
});

async function init() {
  try {
    const [cardsRes, facetsRes] = await Promise.all([
      fetch('data/cards.json'),
      fetch('data/facets.json')
    ]);
    ALL_CARDS = await cardsRes.json();
    FACETS = await facetsRes.json();

    populateSelect(civFilter, FACETS.civilizations);
    populateSelect(typeFilter, FACETS.types);
    populateSelect(rarityFilter, FACETS.rarities);
    populateSelect(setFilter, FACETS.sets);

    const manaCosts = [...new Set(ALL_CARDS.map(c => c.mana_cost).filter(v => v != null))].sort((a,b) => a-b);
    populateSelect(manaFilter, manaCosts.map(String));

    render();
  } catch (err) {
    resultCount.textContent = 'failed to load data';
    grid.innerHTML = `<div style="color:var(--text-dim);padding:40px;">Could not load card data: ${escapeHtml(err.message)}. If you opened this file directly (file://), run a local server instead (see README) since browsers block fetch() on local files.</div>`;
  }
}

init();
</script>

</body>
</html>
